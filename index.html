<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Diet — Plant-Based Menu</title>

    <!-- Browser Tab Favicon / Logo -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Importing fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Reset & Plant-Based Palette Foundations */
        :root {
            --card-bg: rgba(22, 31, 27, 0.85);
            --text-main: #f3f5f4;
            --text-muted: #cbdad0;
            --accent: #52e595;
            --messenger-blue: #0084FF;
            --phone-green: #25D366;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            padding: 40px 24px 140px 24px;
            position: relative;
            min-height: 100vh;
            background-color: #0b0f0d;
        }

        /* Fixed Fullscreen Veggies Background with Dark Blur Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: linear-gradient(rgba(11, 15, 13, 0.82), rgba(11, 15, 13, 0.88)), 
                              url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&q=80&w=1800');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(4px);
            transform: scale(1.05);
        }

        /* Minimal Premium Header Section */
        header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 60px auto;
            background: rgba(11, 15, 13, 0.5);
            padding: 45px 25px;
            border-radius: 24px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* Header Logo Emblem */
        .site-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 18px auto;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(82, 229, 149, 0.4);
        }

        /* Scaled-up Brand Typography */
        header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 4.4rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, #a2ffd0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* Scaled-up Brand Subtitle */
        header .brand-subtitle {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.42em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 22px;
            opacity: 0.95;
            padding-left: 0.42em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
            display: inline-block;
            width: 80%;
        }

        /* Editorial Menu Grid Layout */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        .menu-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-self: start;
        }

        .menu-wrapper:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border-color: rgba(82, 229, 149, 0.3);
        }

        .menu-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: var(--transition);
        }

        .menu-wrapper:hover img {
            transform: scale(1.01);
            opacity: 0.95;
        }

        /* Takeout Box Add-on Banner */
        .takeout-notice {
            background: rgba(14, 20, 17, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
            flex-grow: 1;
        }

        .takeout-notice svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Floating Action Dock */
        .action-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            gap: 16px;
            width: auto;
            max-width: 90%;
        }

        .dock-btn {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            color: #ffffff;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dock-btn.messenger {
            background: var(--messenger-blue);
            box-shadow: 0 10px 25px rgba(0, 132, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .dock-btn.messenger:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 132, 255, 0.5);
            background: #1a8fff;
        }

        .dock-btn.call {
            background: var(--phone-green);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .dock-btn.call:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.5);
            background: #34e075;
        }

        .dock-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Lightbox Overlay */
        .lightbox-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 13, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 92%;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-overlay.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-footer-notice {
            background: rgba(22, 31, 27, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .close-control {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-control:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            transform: rotate(90deg);
        }

        .close-control svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 680px) {
            body { padding: 24px 16px 130px 16px; }
            header { margin-bottom: 40px; padding: 28px 18px; }
            .site-logo { width: 85px; height: 85px; margin-bottom: 14px; }
            header h1 { font-size: 2.8rem; }
            header .brand-subtitle { font-size: 0.95rem; letter-spacing: 0.32em; }
            
            .action-dock { width: 92%; gap: 10px; bottom: 16px; }
            .dock-btn { padding: 14px 16px; font-size: 0.9rem; flex: 1; gap: 8px; }
            .dock-btn svg { width: 18px; height: 18px; }
            
            .close-control { top: 20px; right: 20px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <!-- Lightbox -->
    <div id="viewerLightbox" class="lightbox-overlay" onclick="dismissView()">
        <button class="close-control" aria-label="Close interactive gallery">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <img id="viewerImage" class="lightbox-content" src="" alt="">
        <div class="lightbox-footer-notice">Add-on for Takeout Box</div>
    </div>

    <!-- Interface Logic -->
    <script>
        const lightbox = document.getElementById('viewerLightbox');
        const lightboxImg = document.getElementById('viewerImage');

        function launchView(element) {
            const imageSource = element.querySelector('img').src;
            const imageAlt = element.querySelector('img').alt;
            
            lightboxImg.src = imageSource;
            lightboxImg.alt = imageAlt;
            
            lightbox.style.display = 'flex';
            requestAnimationFrame(() => {
                lightbox.classList.add('active');
            });
        }

        function dismissView() {
            lightbox.classList.remove('active');
            setTimeout(() => {
                lightbox.style.display = 'none';
                lightboxImg.src = '';
            }, 300);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && lightbox.classList.contains('active')) {
                dismissView();
            }
        });
    </script>
